name: Refresh Visitor Count

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-visitor-count-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Refresh visitor snapshot
        run: python scripts/update_visitor_count.py

      - name: Commit visitor snapshot when changed
        shell: bash
        run: |
          git config user.name "nba-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/visitor_count.json
          if git diff --cached --quiet; then
            echo "No visitor-count change to commit."
            exit 0
          fi
          git commit -m "chore(analytics): refresh visitor count"
          git pull --rebase origin main
          git push origin HEAD:main
