name: Refresh Visitor Count

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/update_visitor_count.py"
      - "tests/test_update_visitor_count.py"
      - ".github/workflows/refresh-visitor-count.yml"
      - "analytics.js"
  push:
    branches: [main]
    paths:
      - "scripts/update_visitor_count.py"
      - "tests/test_update_visitor_count.py"
      - ".github/workflows/refresh-visitor-count.yml"
      - "analytics.js"

permissions:
  contents: read

concurrency:
  group: nba-visitor-count-refresh-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run visitor-count unit tests
        run: python -m unittest discover -s tests -p "test_update_visitor_count.py" -v

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
      VISITOR_SNAPSHOT_HEARTBEAT_DAYS: "30"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refresh visitor snapshot
        run: python scripts/update_visitor_count.py

      - name: Commit visitor snapshot when changed or heartbeat is due
        shell: bash
        run: |
          git config user.name "nba-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/visitor_count.json
          if git diff --cached --quiet; then
            echo "No visitor-count change or heartbeat due."
            exit 0
          fi
          git commit -m "chore(analytics): refresh visitor count [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
