name: Refresh NBA Analytics data

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_data.py"
      - "scripts/validate_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/update-nba-data.yml"
  schedule:
    - cron: "17 12 11 2,8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and rebuild NBA data
        run: python scripts/update_data.py

      - name: Validate every dashboard filter and metric family
        run: python scripts/validate_dashboard.py

      - name: Commit refreshed data when changed
        shell: bash
        run: |
          git config user.name "nba-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh NBA statistics"
          git pull --rebase origin main
          git push origin HEAD:main
