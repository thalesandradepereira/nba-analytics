name: Refresh NBA Analytics data

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-nba-data.yml"
  schedule:
    - cron: "17 12 11 2,8 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download, validate and rebuild NBA data
        run: python scripts/update_data.py

      - name: Commit refreshed data when changed
        shell: bash
        run: |
          git config user.name "nba-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh NBA statistics"
          git push
